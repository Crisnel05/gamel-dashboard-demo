# Demo profile: in-memory H2 database filled with fictional data.
# Nothing to install: run ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:mem:gamel;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
